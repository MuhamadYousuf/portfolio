<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
<style>
  canvas { display: block; width: 100%; height: 100%; }
  .label { position: absolute; z-index: 10; font: 500 12px 'DM Mono'; letter-spacing: .14em; color: #3a2733; text-transform: uppercase; }
</style></head>
<body>
<div class="board cover grain" data-out="helio/cover">
  <canvas id="c"></canvas>
  <div class="label" style="top:40px;left:44px">Helio — Daily sun care</div>
  <div class="label" style="top:40px;right:44px">2025</div>
  <div class="label" style="bottom:40px;left:44px">Packaging · Art direction</div>
  <div class="label" style="bottom:40px;right:44px">01 / 02</div>
</div>
<script type="module">
  import { THREE, stage, done } from './stage.js'
  import { buildHelio } from './helio-scene.js'
  const W = 1200, H = 1500
  const { renderer, scene } = stage(document.getElementById('c'), { width: W, height: H, exposure: 1.0, env: 0.3, tone: THREE.ACESFilmicToneMapping })
  const camera = new THREE.PerspectiveCamera(24, W / H, 0.05, 10)
  camera.position.set(0.04, 0.2, 1.22)
  camera.lookAt(-0.01, 0.135, 0)
  await buildHelio(scene)
  done(renderer, scene, camera)
</script>
</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css">
<script type="importmap">{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }</script>
<style>
  canvas { display: block; width: 100%; height: 100%; }
  .label { position: absolute; z-index: 10; font: 500 11px 'DM Mono'; letter-spacing: .14em; color: #3b2a1d; text-transform: uppercase; }
  .panel { position: absolute; z-index: 5; left: 0; top: 0; bottom: 0; width: 430px; background: #efe4d2; color: #2a1f17; padding: 96px 44px 0; }
  .mac { position: relative; }
  .mac::before { content: ''; position: absolute; left: 16%; right: 16%; top: .14em; height: .042em; background: currentColor; }
  .tag { position: absolute; z-index: 10; transform: translate(-50%, -50%); line-height: 1.5; text-align: center; font: 500 10px 'DM Mono'; letter-spacing: .16em; color: #3b2a1d; }
</style></head>
<body>
<div class="board wide grain" data-out="koen/board">
  <canvas id="c"></canvas>
  <div class="panel">
    <svg viewBox="0 -40 160 160" width="104" height="104"><defs><clipPath id="s"><rect x="0" y="-40" width="160" height="120"/><rect x="0" y="86" width="160" height="7"/><rect x="0" y="99" width="160" height="5"/><rect x="0" y="110" width="160" height="3"/></clipPath></defs><circle cx="80" cy="75" r="50" fill="#e4572e" clip-path="url(#s)"/><rect x="6" y="79" width="148" height="1.6" fill="#e4572e"/></svg>
    <div style="font-family:Fraunces;font-variation-settings:'opsz' 144;font-weight:330;font-size:74px;letter-spacing:.18em;line-height:1;margin-top:16px">K<span class="mac">O</span>EN</div>
    <div class="mono" style="font-size:11px;letter-spacing:.42em;color:#b9431f;margin-top:12px">COFFEE ROASTERS</div>
    <p style="font:italic 340 21px/1.35 Fraunces;margin-top:40px;max-width:330px">Every origin gets its own sunrise. Lined up on a shelf, the range reads from first light to full day.</p>
    <div style="display:flex;gap:8px;margin-top:36px"><i style="width:40px;height:40px;border-radius:50%;background:#191512"></i><i style="width:40px;height:40px;border-radius:50%;background:#e4572e"></i><i style="width:40px;height:40px;border-radius:50%;background:#b6421f"></i><i style="width:40px;height:40px;border-radius:50%;background:#ece2d0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)"></i></div>
    <p class="mono" style="font-size:10px;letter-spacing:.12em;margin-top:10px;opacity:.6">ROAST BLACK · SUN ORANGE · CLAY · OAT</p>
    <p class="mono" style="position:absolute;left:44px;bottom:40px;font-size:10px;letter-spacing:.12em;opacity:.6;line-height:1.7">FRAUNCES — WORDMARK &amp; ORIGINS<br>DM MONO — ROAST DATA</p>
  </div>
  <div class="label" style="top:36px;right:44px">02 / 02</div>
  <div class="tag" id="t0">FIRST LIGHT<br><span style="opacity:.55">ETHIOPIA</span></div>
  <div class="tag" id="t1">SUNRISE<br><span style="opacity:.55">COLOMBIA</span></div>
  <div class="tag" id="t2">FULL DAY<br><span style="opacity:.55">KENYA</span></div>
</div>

<script type="module">
  import { THREE, stage, loadTex, noiseCanvas, normalFromHeight, sweep, goboCanvas, done } from './stage.js'
  import { pouch } from './props.js'

  const W = 1800, H = 1125
  const { renderer, scene } = stage(document.getElementById('c'), { width: W, height: H, exposure: 1.0, env: 0.18, tone: THREE.ACESFilmicToneMapping })
  const camera = new THREE.PerspectiveCamera(22, W / H, 0.05, 10)
  camera.position.set(0.03, 0.2, 1.55)
  camera.lookAt(0.03, 0.14, 0)

  const plaster = noiseCanvas(512, { scale: 6, octaves: 5, seed: 11 })
  const room = sweep({ width: 4, depth: 1.4, height: 1.5, radius: 0.22, color: '#ead6ba', roughness: 0.95, normalMap: normalFromHeight(plaster, 1.5), normalScale: 0.25 })
  room.position.z = -0.26
  room.material.normalMap.repeat.set(6, 6)
  scene.add(room)

  const plinth = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.045, 0.17), new THREE.MeshStandardMaterial({ color: '#dcc3a0', roughness: 0.9, normalMap: normalFromHeight(noiseCanvas(512, { scale: 12, octaves: 4, seed: 2 }), 2), normalScale: new THREE.Vector2(0.3, 0.3) }))
  plinth.position.set(0.2, 0.0225, -0.02)
  plinth.castShadow = plinth.receiveShadow = true
  scene.add(plinth)

  const sun = new THREE.SpotLight('#ffdcb2', 11, 0, 0.5, 0.5, 0)
  sun.position.set(-0.6, 0.95, 0.85)
  sun.target.position.set(0.15, 0.1, -0.12)
  sun.map = goboCanvas('blinds')
  sun.castShadow = true
  sun.shadow.mapSize.set(4096, 4096)
  sun.shadow.bias = -0.00008
  sun.shadow.normalBias = 0.0015
  sun.shadow.camera.near = 0.3; sun.shadow.camera.far = 3
  scene.add(sun, sun.target, new THREE.HemisphereLight('#fff1e2', '#9c7a5c', 0.5))

  const texs = await Promise.all(['koen-black', 'koen-cream', 'koen-clay'].map((n) => loadTex(`../tex/out/${n}.png`)))
  const backs = ['#191512', '#ece2d0', '#b6421f']
  const xs = [0.03, 0.2, 0.37]
  xs.forEach((x, i) => {
    const p = pouch(texs[i], backs[i])
    p.position.set(x, p.position.y + 0.045, -0.02)
    p.rotation.y = -0.06
    scene.add(p)
    const v = new THREE.Vector3(x, 0.03, 0.065).project(camera)
    const tag = document.getElementById('t' + i)
    tag.style.left = ((v.x + 1) / 2) * 1200 + 'px'
    tag.style.top = ((1 - v.y) / 2) * 750 + 'px'
  })


  done(renderer, scene, camera)
</script>
</body></html>
